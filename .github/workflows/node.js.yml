name: CI / Build (Vite + TypeScript)

on:
  push:
    branches: ["develop"]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build (Vite)
        run: npm run build
      - run: |
          touch .env
          echo "${{secrets.PROD_ENV_FILE}}" > .env
